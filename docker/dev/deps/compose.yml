services:
  db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped
    volumes:
      - english_go_db:/data/db

  my-voc:
    image: my-voc:latest
    pull_policy: never
    ports:
      - "${MY_VOC_API_PORT}:80"
    environment:
      MONGODB_URI: mongodb://db:27017/my-voc
      AUTHENTICATION: ${MY_VOC_API_PASSWORD:?未设置 my-voc 服务的 AUTHENTICATION}
    depends_on:
      - db
    restart: unless-stopped

  llm4voc:
    image: llm4voc:latest
    pull_policy: never
    ports:
      - "127.0.0.1:${LLM4VOC_API_PORT}:80"
    environment:
      DEEPSEEK_APIKEY: ${LLM4VOC_DEEPSEEK_APIKEY:?未设置 llm4voc 服务的 DeepSeek API Key}
      AUTHENTICATION: ${LLM4VOC_API_PASSWORD:?未设置 llm4voc 服务的 AUTHENTICATION}
    depends_on:
      - db
    restart: unless-stopped

  edge-tts-server:
    image: edge-tts-server:latest
    pull_policy: never
    ports:
      - "${TTS_API_PORT}:80"
    environment:
      AUTHENTICATION: ${TTS_API_PASSWORD:?未设置 edge-tts-server 服务的 AUTHENTICATION}
    restart: unless-stopped

volumes:
  english_go_db:
