services:
  db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped
    volumes:
      - english_go_db:/data/db
  my-voc:
    image: my-voc:latest
    pull_policy: never
    ports:
      - "127.0.0.1:${MY_VOC_API_PORT}:80"
    environment:
      MONGODB_URI: mongodb://db:27017/my-voc
    depends_on:
      - db
    restart: unless-stopped

  llm4voc:
    image: llm4voc:latest
    pull_policy: never
    ports:
      - "127.0.0.1:${LLM4VOC_API_PORT}:80"
    environment:
      deepseek_apikey: ${LLM4VOC_DEEPSEEK_APIKEY:?未设置 llm4voc 服务的 DeepSeek API Key}
    depends_on:
      - db
    restart: unless-stopped

  edge-tts-server:
    image: edge-tts-server:latest
    pull_policy: never
    ports:
      - "127.0.0.1:${TTS_API_PORT}:80"
    environment:
      password: ${TTS_API_PASSWORD:?未设置 edge-tts-server 服务的密码}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  english_go_db:
